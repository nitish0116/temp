paths:
  # Relative paths are resolved from this configuration file.
  output_directory: "../output"

backup:
  enabled: true
  directory: "../backup"

cleanup:
  enabled: true
  # Content-removal policies are opt-in. A cleaner should preserve legitimate
  # front/back matter, profiles, notes, and publisher material by default.
  remove_front_matter: true
  excluded_sections: ["Character Profiles", "Afterword"]
  # Picture OCR modes: safe | keep | remove. Safe retains picture text that
  # passes conservative language/readability checks.
  picture_ocr_mode: "remove"
  remove_promotional_tail: true
  remove_publisher_tail: true
  remove_glossary_footnotes: true
  remove_footnotes: true
  strip_markdown_emphasis: true
  # Report suspicious whole-document OCR lines but never delete them.
  report_ocr_noise: false
  ocr_noise_report_limit: 100

tts_validation:
  # Report-only validation; cleaned Markdown is never modified by this stage.
  enabled: true
  chunk_size: 2600
  minimum_alpha: 4
  report_limit: 200

mutation:
  # Proposals below this confidence remain in reports but are not applied.
  minimum_confidence: 90
  # Set true for a dry run that reports every proposed mutation.
  report_only: false

page_artifacts:
  enabled: true
  # Start conservatively; use "remove" only after reviewing reports.
  mode: "report_only"
  minimum_occurrences: 3
  minimum_line_gap: 12
  maximum_length: 80
  report_limit: 100

unicode:
  enabled: true
  normalize_form: "NFKC"
  fixes:
    mojibake: true
    ligatures: true
    invisible_characters: true
    whitespace: true
    punctuation: true

regex:
  enabled: true
  corrections:
    # Dangerous global substitutions such as rn->m are deliberately omitted.
    zero_to_o:
      enabled: true
    one_to_l:
      enabled: true
    five_to_s:
      enabled: true
    eight_to_b:
      enabled: true
    broken_words:
      enabled: true
    broken_hyphen_words:
      enabled: true
    repeated_characters:
      enabled: true

symspell:
  enabled: true
  # Uses the 82k English frequency dictionary shipped by the symspellpy package.
  dictionary: "builtin:en-82k"
  glossary: "data/custom_words.json"
  learned: "data/learned_words.json"
  broken_word_decisions: "data/broken_word_decisions.json"
  max_edit_distance: 2
  max_auto_edit_distance: 1
  confidence_threshold: 92
  minimum_word_length: 4
  minimum_dictionary_frequency: 1
  minimum_candidate_frequency: 1000
  # Conservative threshold for joining PDF/OCR spaces inside words.
  broken_word_merge_minimum_frequency: 50000
  # Broader corpus evidence for words omitted from the compact dictionary.
  wordfreq_enabled: true
  wordfreq_language: "en"
  wordfreq_wordlist: "large"
  wordfreq_minimum_zipf: 2.5
  # Bounded retries allow chained fragments to merge without an open-ended loop.
  maximum_merge_passes: 3
  # Joined words must beat genuine hyphenated compounds by this Zipf margin.
  dehyphenation_zipf_margin: 0.5
  ambiguity_margin: 2
  auto_protect_proper_nouns: true
  proper_noun_min_occurrences: 2
  protected:
    - "Ainz"
    - "Yggdrasil"
    - "Nazarick"

context_validator:
  # Optional second opinion for suspicious inline word boundaries. Install
  # requirements-transformer.txt before enabling; the model downloads once
  # unless local_files_only is true.
  enabled: true
  model: "distilbert/distilroberta-base"
  candidate_file: "data/ocr_boundary_candidates.json"
  batch_size: 16
  max_length: 128
  context_characters: 600
  # Joined localized pseudo-log-likelihood must beat the spaced form by this.
  merge_margin: 0.35
  device: "auto"
  local_files_only: false

vocabulary_candidates:
  # Discover repeated unknown terms, but never modify custom_words.json.
  enabled: true
  minimum_occurrences: 3
  report_limit: 200
  # Reviewed terms that should no longer appear as pending candidates.
  rejected: "data/rejected_words.json"

contextual_real_words:
  # Known-word substitutions are uncertain and therefore report-only.
  enabled: true
  rules: "data/contextual_word_rules.json"
  report_limit: 200

report:
  enabled: true
  export_json: true
  export_summary: true
  include_low_confidence: true
  review_threshold: 85

logging:
  level: "INFO"
  directory: "../logs"
  file: "../logs/pipeline.log"
