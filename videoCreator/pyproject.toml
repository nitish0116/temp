[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-novel-video-creator"
version = "0.1.0"
description = "Resumable web-novel to narrated visual-video pipeline"
requires-python = ">=3.11"

[project.scripts]
video-creator = "video_creator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
