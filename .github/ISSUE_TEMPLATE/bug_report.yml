name: Bug report
description: Report reproducible incorrect behavior in one of the toolkit components.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to provide a reproducible report. Do not attach private documents, copyrighted media, credentials, or model caches.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - pdf-md
        - cleanup/markdownCleaner
        - md-audio
        - md_python
        - mp3ToYT
        - videotranslator
        - stats or repository tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe command or synthetic fixture that reproduces the issue.
      render: powershell
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Windows, Python, PowerShell, FFmpeg, GPU, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, usernames, private paths, and copyrighted content.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and private or copyrighted input from this report.
          required: true
        - label: This is not a security vulnerability; security issues are reported privately.
          required: true

